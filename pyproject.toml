[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Establish a syntax/error baseline without silently rewriting the existing
# compatibility facades. Broader rules can be enabled incrementally.
select = ["E4", "E7", "E9"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
show_error_codes = true
exclude = ["migrations/"]
follow_imports = "skip"

[tool.interrogate]
fail-under = 95
ignore-init-method = true
ignore-module = true
ignore-nested-functions = true
exclude = ["migrations", "tests"]
quiet = false
verbose = 1
