<!doctype html>
<html lang="en">
  <head>
    {# MFA pages deliberately load only same-origin assets permitted by CSP. #}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>{{ page_title }} · Club Gift Aid Manager</title>
    <link nonce="{{ csp_nonce }}" href="{{ url_for('static', filename='vendor/bootstrap/5.3.3/bootstrap.min.css') }}" rel="stylesheet" />
    <link nonce="{{ csp_nonce }}" href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet" />
  </head>
  <body class="bg-body-tertiary">
    <main class="container py-5 mfa-container">
      <section class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
          <p class="text-uppercase small fw-semibold text-primary mb-2">Account security</p>
          <h1 class="h3 mb-3">{{ page_title }}</h1>
          {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
