name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@1e60f620b9541d5416c2435c8b2e21f9a15c8e1 # v4.0.4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked application and test dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install pinned quality tools
        run: python -m pip install ruff==0.14.5 mypy==1.18.2 interrogate==1.7.0 bandit==1.8.6 pip-audit==2.10.1
      - name: Audit Python dependencies against vulnerability advisories
        run: python -m pip_audit -r requirements.txt --disable-pip
      - name: Scan first-party Python for common security defects
        run: python -m bandit -r club_gift_aid_manager app.py audit_export.py backup.py manage.py monitoring.py retention.py -c .bandit
      - name: Ruff static checks
        run: ruff check club_gift_aid_manager app.py backup.py audit_export.py manage.py monitoring.py retention.py tests
      - name: Ruff formatting
        run: ruff format --check club_gift_aid_manager app.py backup.py audit_export.py manage.py monitoring.py retention.py tests
      - name: Type check typed domain boundaries
        run: mypy club_gift_aid_manager/domain club_gift_aid_manager/dtos club_gift_aid_manager/models club_gift_aid_manager/security club_gift_aid_manager/mfa
      - name: Enforce first-party docstring coverage
        run: interrogate club_gift_aid_manager app.py backup.py audit_export.py manage.py monitoring.py retention.py
      - name: Syntax-check every first-party JavaScript file
        shell: bash
        run: git ls-files -z '*.js' | xargs -0 -n1 node --check
      - name: Install locked browser-test dependencies
        run: npm ci --ignore-scripts
      - name: Audit JavaScript dependencies against vulnerability advisories
        run: npm audit
      - name: Run tests with coverage gate
        run: python -m pytest --cov=app --cov=club_gift_aid_manager --cov-branch --cov-report=term-missing --cov-fail-under=80 -q
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser integration tests
        run: npm run test:browser
