name: Dependency audit

on:
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements.in"
      - "static/vendor/**"
      - "VENDORED-ASSETS.md"
      - "osv-scanner-custom.json"
      - ".github/workflows/dependency-audit.yml"
  push:
    paths:
      - "requirements.txt"
      - "requirements.in"
      - "static/vendor/**"
      - "VENDORED-ASSETS.md"
      - "osv-scanner-custom.json"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked application dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install audit and SBOM tools
        run: python -m pip install pip-audit==2.10.1 cyclonedx-bom==8.0.1
      - name: Scan requirements
        run: pip-audit --requirement requirements.txt
      - name: Verify vendored assets
        run: sha256sum --check static/vendor/VENDORED-ASSETS.sha256
      - name: Scan Python and explicitly inventoried front-end dependencies
        uses: google/osv-scanner-action/osv-scanner-action@0e457b42d0120153c352875e9b758b1e5c58c7e5 # v2.7.1
        with:
          scan-args: |-
            --recursive
            ./
      - name: Generate CycloneDX SBOM
        run: python -m cyclonedx_py requirements requirements.txt --output-format JSON --output-file sbom.cdx.json --validate
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyclonedx-sbom
          path: sbom.cdx.json
