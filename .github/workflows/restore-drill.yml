name: Backup restore drill

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Restore an encrypted test backup into an isolated database
        run: python -m pytest tests/operations/test_hardening.py::test_backup_restore_drill_uses_an_isolated_database -q
